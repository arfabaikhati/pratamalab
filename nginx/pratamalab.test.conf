# ============================================================
#  PratamaLab — SATU domain untuk segalanya
#
#  http://pratamalab.test        → Next.js Frontend (port 3000)
#  http://pratamalab.test/api/*  → Laravel Backend (PHP-FPM)
# ============================================================

# Server khusus Laravel — listen di port 8100 (internal only)
server {
    listen 127.0.0.1:8100;
    server_name pratamalab.test;

    root "C:/laragon/www/pratamalab/backend/public";
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.          { deny all; }
}

# Server utama — port 80, routing frontend vs backend
server {
    listen 80;
    server_name pratamalab.test;

    charset utf-8;
    client_max_body_size 100M;

    # ── /api/* /up /sanctum/* /broadcasting/* → Laravel (port 8100) ──
    location ~ ^/(api|up|sanctum|broadcasting)(/|$) {
        proxy_pass         http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Semua lainnya → Next.js (port 3000) ──────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @frontend_down;
    }

    # Halaman saat Next.js belum jalan
    location @frontend_down {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>PratamaLab</title><style>*{box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#f7f7f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.card{background:#fff;border-radius:16px;padding:40px;text-align:center;max-width:480px;box-shadow:0 4px 24px rgba(0,0,0,.08)}.logo{width:48px;height:48px;background:#3b5bfc;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;margin-bottom:16px}h1{margin:0 0 8px;font-size:20px;color:#1a1a1a}p{color:#787774;margin:0 0 24px;font-size:14px}code{display:block;background:#f0f4ff;border:1px solid #c0d2ff;border-radius:8px;padding:12px 16px;font-size:13px;color:#2a3ef1;text-align:left;white-space:nowrap}</style></head><body><div class="card"><div class="logo">P</div><h1>Frontend belum berjalan</h1><p>Jalankan perintah ini di terminal, lalu refresh halaman ini.</p><code>cd C:\laragon\www\pratamalab\frontend<br>npm run dev</code></div></body></html>';
    }

    # Block file tersembunyi
    location ~ /\.(?!well-known) { deny all; }
}
