# ── PratamaLab — Nginx config for Laragon ──────────────────────────────────
#
# Akses:
#   http://pratamalab.test       → Laravel API (backend)
#   http://app.pratamalab.test   → Next.js frontend (proxy ke port 3000)
#
# Catatan: Next.js tetap harus dijalankan manual: npm run dev (port 3000)
#          Laravel tetap harus dijalankan manual: php artisan serve (port 8000)
#          ATAU biarkan Nginx yang serve Laravel langsung (tanpa artisan serve)
# ---------------------------------------------------------------------------

# ── Backend: Laravel API → http://pratamalab.test ──────────────────────────
server {
    listen 80;
    server_name pratamalab.test;

    # Laravel public folder sebagai root
    root "C:/laragon/www/pratamalab/backend/public";
    index index.php;

    charset utf-8;

    # Handle semua request ke index.php (Laravel routing)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM untuk file .php
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Abaikan favicon & robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Blok akses ke file tersembunyi (.env, .git, dll)
    location ~ /\. {
        deny all;
    }

    # CORS header untuk API (dihandle Laravel, tapi backup di sini)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}

# ── Frontend: Next.js → http://app.pratamalab.test ─────────────────────────
server {
    listen 80;
    server_name app.pratamalab.test;

    # Proxy semua request ke Next.js dev server di port 3000
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# ── WebSocket Reverb → ws://ws.pratamalab.test ─────────────────────────────
server {
    listen 80;
    server_name ws.pratamalab.test;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
